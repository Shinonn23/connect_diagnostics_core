approval_policy = "never"
sandbox_mode = "danger-full-access"

[features]
hooks = true

[agents]
enabled = true
# Keep at most four live threads including the primary agent.
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "low"
interrupt_message = true

[agents.explorer]
description = "Read-only codebase and installed-source investigator."
config_file = "./agents/explorer.toml"

[agents.worker]
description = "Implementation agent for one bounded, plan-ready task with exclusive write ownership."
config_file = "./agents/worker.toml"

[agents.reviewer]
description = "Independent plan, code, test, security, lifecycle, and documentation reviewer."
config_file = "./agents/reviewer.toml"

[agents.browser_tester]
description = "Computer Use acceptance tester for real Frappe Desk workflows."
config_file = "./agents/browser_tester.toml"

[agents.doc_writer]
description = "Final documentation writer for accepted shipped behavior."
config_file = "./agents/doc_writer.toml"
