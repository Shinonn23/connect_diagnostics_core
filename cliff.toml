# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration
#
# ─────────────────────────────────────────────────────────────────────────────
# Branch-aware release labelling
# ─────────────────────────────────────────────────────────────────────────────
# This config inspects the env var `GIT_BRANCH` to decide whether the current
# unreleased commits should be labelled as a release block or kept as
# "[unreleased]".
#
# Branch model:
#   • production              → release block:  ## [prod-YYYY.MM.DD] - DATE
#   • user-acceptance-testing → release block:  ## [uat-YYYY.MM.DD]  - DATE
#   • developments            → "[unreleased]" — base for upcoming releases
#   • feature/*               → "[unreleased]", but commits not yet merged to
#                               `developments` should be excluded via --range
#
# Invocation:
#
#   # On production — render as a prod release entry
#   GIT_BRANCH=production git cliff -o CHANGELOG.md
#
#   # On UAT — render as a uat release entry
#   GIT_BRANCH=user-acceptance-testing git cliff -o CHANGELOG.md
#
#   # On developments — unreleased up to developments HEAD
#   git cliff --unreleased -o CHANGELOG.md
#
#   # On feature branch — exclude unmerged commits by limiting to developments
#   git cliff --unreleased --range developments -o CHANGELOG.md
#
# Tip: auto-detect with one line in CI/shell:
#   GIT_BRANCH=$(git branch --show-current) git cliff -o CHANGELOG.md
# ─────────────────────────────────────────────────────────────────────────────

[changelog]
# A Tera template for the changelog header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog

All notable changes to **connect_diagnostics_core** are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Commits follow the [Conventional Commits](https://www.conventionalcommits.org) specification.

"""
# A Tera template rendered for each release in the changelog.
# `GIT_BRANCH` env var selects between release label and "[unreleased]".
body = """
{% set branch = get_env(name="GIT_BRANCH", default="") -%}
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% elif branch == "production" -%}
    ## [prod-{{ now() | date(format="%Y.%m.%d") }}] - {{ now() | date(format="%Y-%m-%d") }}
{% elif branch == "user-acceptance-testing" -%}
    ## [uat-{{ now() | date(format="%Y.%m.%d") }}] - {{ now() | date(format="%Y-%m-%d") }}
{% else -%}
    ## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}_({{ commit.scope }})_ {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# Footer template — rendered once after all releases.
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# Postprocessors run on the rendered changelog text.
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/Shinonn23/connect_diagnostics_core" },
]

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = true
# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
    # Turn `(#123)` PR refs into clickable links.
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))" },

    # ─────────────────────────────────────────────────────────────────────────
    # Backfill legacy non-conventional commit subjects so they group correctly
    # in the rendered changelog. Patterns anchor on `^` to only touch the
    # subject line — bodies are left untouched.
    # ─────────────────────────────────────────────────────────────────────────

    # CI / workflow
    { pattern = "^Run CI on pull requests for multiple branches", replace = "ci: run CI on pull requests for multiple branches" },
    { pattern = "^Update CI workflow for Frappe v15 and toolchain", replace = "ci: update workflow for Frappe v15 and toolchain" },
    { pattern = "^Use env vars for event data in Discord workflows", replace = "ci: use env vars for event data in Discord workflows" },

    # Tests
    { pattern = "^Use autoname in employee autoname tests", replace = "test(employee): use autoname in autoname tests" },

    # Refactors
    { pattern = "^Refactor rename_tool_v2\\.py and its tests for improved type hinting and code clarity", replace = "refactor(rename-tool): improve type hints and code clarity in rename_tool_v2" },
    { pattern = "^Remove deprecated master data mapping and reporting modules", replace = "refactor(master-data): remove deprecated mapping and reporting modules" },
    { pattern = "^Simplify employee autoname and update typing config", replace = "refactor(employee): simplify autoname and update typing config" },

    # Chores (typing, tooling, fixtures, editor config)
    { pattern = "^Annotate type-ignore for joining date attribute", replace = "chore(typing): annotate type-ignore for joining date attribute" },
    { pattern = "^Clear Typings", replace = "chore(typing): clear typings" },
    { pattern = "^Add frappe stub", replace = "chore(typing): add frappe stub" },
    { pattern = "^Add Zed folder settings and clean pyright ignores", replace = "chore(editor): add Zed folder settings and clean pyright ignores" },
    { pattern = "^Use '!\\.\\.\\.' instead of '\\.\\.\\.' in \\.zed settings", replace = "chore(editor): use '!...' instead of '...' in .zed settings" },
    { pattern = "^remove fixture", replace = "chore: remove fixture" },
    { pattern = "^refresh checks", replace = "chore: refresh checks" },
    { pattern = "^add customize erpnext form", replace = "chore: add customize ERPNext form" },

    # Stray merge subject without the standard "Merge ..." prefix — drop via
    # the existing `^chore\(merge\)` skip rule.
    { pattern = "^bench check-master-data", replace = "chore(merge): bench check-master-data" },

    # `Revert "<type>(<scope>): <subject>"` → `revert: <subject>`
    { pattern = '^Revert "(feat|fix|chore|docs|refactor|test|style|perf|ci|build)(\([^)]+\))?: (.+)"', replace = "revert: ${3}" },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = true
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups. Order matters: first match wins.
commit_parsers = [
    # Drop noise before grouping.
    { message = "^Merge ", skip = true },
    { message = "^chore\\(merge\\)", skip = true },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^chore\\(changelog\\)", skip = true },

    # Breaking changes bubble to the top regardless of type.
    { body = ".*BREAKING CHANGE", group = "<!-- 0 -->💥 Breaking Changes" },

    # Conventional Commit groups.
    { message = "^feat", group = "<!-- 1 -->🚀 Features" },
    { message = "^fix", group = "<!-- 2 -->🐛 Bug Fixes" },
    { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
    { message = "^refactor", group = "<!-- 4 -->🚜 Refactor" },
    { message = "^doc", group = "<!-- 5 -->📚 Documentation" },
    { message = "^test", group = "<!-- 6 -->🧪 Testing" },
    { message = "^style", group = "<!-- 7 -->🎨 Styling" },
    { message = "^revert", group = "<!-- 8 -->◀️ Revert" },
    { message = "^build", group = "<!-- 9 -->📦 Build" },
    { message = "^ci", group = "<!-- 10 -->🤖 CI/CD" },
    { message = "^chore", group = "<!-- 11 -->⚙️ Miscellaneous Tasks" },
    { body = ".*security", group = "<!-- 12 -->🛡️ Security" },

    # Everything else lands here so nothing silently disappears.
    { message = ".*", group = "<!-- 13 -->💼 Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Fail on a commit that is not matched by any commit parser.
fail_on_unmatched_commit = false
# Link parsers turn `#123` references into URLs in commit messages.
link_parsers = [
    { pattern = "#(\\d+)", href = "https://github.com/Shinonn23/connect_diagnostics_core/issues/$1" },
]
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order commits topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "newest"
# Process submodules commits
recurse_submodules = false
