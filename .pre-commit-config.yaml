exclude: |
    (?x)^(
        \.zed/.*|
        node_modules/.*|
        \.git/.*
    )$
default_stages: [pre-commit]
fail_fast: false

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
            files: "connect_diagnostics_core.*"
            exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
          - id: check-merge-conflict
          - id: check-ast
          - id: check-json
          - id: check-toml
          - id: check-yaml
          - id: debug-statements

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.8.1
      hooks:
          - id: ruff
            name: "Run ruff import sorter"
            args: ["--select=I", "--fix"]
            exclude: "typings/"

          - id: ruff
            name: "Run ruff linter"
            exclude: "typings/"

          - id: ruff-format
            name: "Run ruff formatter"
            exclude: "typings/"

    - repo: https://github.com/pre-commit/mirrors-prettier
      rev: v2.7.1
      hooks:
          - id: prettier
            name: "Format JS/Vue/SCSS"
            types_or: [javascript, vue, scss]
            args: ["--write"]
            exclude: |
                (?x)^(
                    connect_diagnostics_core/public/dist/.*|
                    .*node_modules.*|
                    .*boilerplate.*|
                    connect_diagnostics_core/templates/includes/.*|
                    connect_diagnostics_core/public/js/lib/.*
                )$

          - id: prettier
            name: "Format JSON"
            types_or: [json]
            args: ["--write", "--tab-width", "4"]
            exclude: |
                (?x)^(connect_diagnostics_core/public/dist/.*|.*node_modules.*|.*boilerplate.*|.*zed.*|.*vscode.*)$

    - repo: https://github.com/pre-commit/mirrors-eslint
      rev: v8.44.0
      hooks:
          - id: eslint
            types_or: [javascript]
            args: ["--quiet"]
            exclude: |
                (?x)^(
                    connect_diagnostics_core/public/dist/.*|
                    cypress/.*|
                    .*node_modules.*|
                    .*boilerplate.*|
                    connect_diagnostics_core/templates/includes/.*|
                    connect_diagnostics_core/public/js/lib/.*
                )$

ci:
    autoupdate_schedule: weekly
    skip: []
    submodules: false
