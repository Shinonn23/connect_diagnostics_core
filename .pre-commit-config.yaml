exclude: |
    (?x)^(
        \.git/.*|
        \.zed/.*|
        \.vscode/.*|
        node_modules/.*|
        .*/dist/.*|
        .*/coverage/.*|
        .*/__pycache__/.*|
        typings/.*
    )$

default_stages: [pre-commit]
fail_fast: false

default_language_version:
    python: python3.12

repos:
    # =========================================================
    # Basic sanity checks
    # =========================================================
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
            exclude: ".*(json|txt|csv|md|svg)$"

          - id: end-of-file-fixer

          - id: check-merge-conflict

          - id: check-ast

          - id: debug-statements

          - id: check-json

          - id: check-toml

          - id: check-yaml
            args: [--unsafe]

    # =========================================================
    # Ruff (lint + import sort + autofix)
    # =========================================================
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.14.1
      hooks:
          - id: ruff-check
            name: ruff-check
            args:
                - --fix
                - --exit-non-zero-on-fix
            exclude: "typings/"

          - id: ruff-format
            name: ruff-format
            exclude: "typings/"

    # =========================================================
    # Pyrefly (type checking)
    # =========================================================
    - repo: local
      hooks:
          - id: pyrefly
            name: pyrefly
            language: system
            entry: pyrefly check
            types: [python]

            # ค่อย ๆ เปิด scope ก่อนสำหรับ frappe
            files: "^connect_diagnostics_core/"

    # =========================================================
    # Semgrep
    # =========================================================
    - repo: https://github.com/semgrep/pre-commit
      rev: v1.163.0
      hooks:
          - id: semgrep
            name: semgrep-frappe
            args:
                - --config=https://github.com/frappe/semgrep-rules
                - --config=r/python.lang.correctness
            exclude: |
                (?x)^(
                    typings/.*|
                    node_modules/.*|
                    .*/dist/.*
                )$

    # =========================================================
    # Prettier
    # ใช้ local เพราะ sync กับ package.json จริง
    # =========================================================
    - repo: local
      hooks:
          - id: prettier
            name: prettier
            language: system
            entry: npx prettier --write
            types_or:
                [javascript, jsx, ts, tsx, vue, scss, css, json, yaml, markdown]

            exclude: |
                (?x)^(
                    node_modules/.*|
                    .*/dist/.*|
                    .*boilerplate.*|
                    connect_diagnostics_core/public/js/lib/.*
                )$

    # =========================================================
    # ESLint
    # ใช้ local เพื่อใช้ dependency จริงของ project
    # =========================================================
    - repo: local
      hooks:
          - id: eslint
            name: eslint
            language: system
            entry: npx eslint --quiet
            types_or: [javascript, jsx, ts, tsx, vue]

            exclude: |
                (?x)^(
                    node_modules/.*|
                    cypress/.*|
                    .*/dist/.*|
                    .*boilerplate.*|
                    connect_diagnostics_core/public/js/lib/.*
                )$

# =============================================================
# pre-commit.ci
# =============================================================
ci:
    autoupdate_schedule: weekly
    submodules: false

    # semgrep + pyrefly มักหนักสำหรับ auto-fix bot
    skip:
        - semgrep-frappe
        - pyrefly
