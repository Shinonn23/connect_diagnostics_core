name: CI
env:
  PRE_COMMIT_VERSION: "4.6.1"

on:
  pull_request:
    branches:
      - production
      - user-acceptance-testing
      - developments
concurrency:
  group: develop-connect_diagnostics_core-${{ github.event.number }}
  cancel-in-progress: true
jobs:
  tests:
    name: Server
    runs-on: ubuntu-22.04
    services:
      redis-cache:
        image: redis:7.0-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7.0-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3
    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The job always runs and always reports, because `Server` is a required status
      # check: a job skipped by a path or branch filter never reports and would leave the
      # pull request blocked on a pending check. Only the expensive steps are gated.
      - name: Detect change scope
        id: scope
        uses: ./.github/actions/change-scope
      - name: Find tests
        if: steps.scope.outputs.run_full == 'true'
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null
      - name: Setup Python
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Setup Node
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true
      - name: Install Yarn
        if: steps.scope.outputs.run_full == 'true'
        run: npm install -g yarn@1.22.22
      - name: Cache pip
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-
      - name: Get yarn cache directory path
        if: steps.scope.outputs.run_full == 'true'
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'
      - name: Cache yarn
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-
      - name: Setup
        if: steps.scope.outputs.run_full == 'true'
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-branch version-16 ~/frappe-bench
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mysql --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"
      - name: Install
        if: steps.scope.outputs.run_full == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-16
          bench get-app hrms --branch version-16
          bench get-app https://github.com/ecosoft-frappe/erpnext_thailand
          bench get-app connect_diagnostics_core $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site install-app erpnext_thailand
          bench --site test_site install-app connect_diagnostics_core
          bench build
        env:
          CI: "Yes"
      - name: Run Type Checks
        if: steps.scope.outputs.run_full == 'true'
        run: |
          python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run ty-check --all-files
        env:
          TY_PYTHON: /home/runner/frappe-bench/env/bin/python
      - name: Run Tests
        if: steps.scope.outputs.run_full == 'true'
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app connect_diagnostics_core
        env:
          TYPE: server
