name: Linters

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
    cancel-in-progress: true

jobs:
    linter:
        name: "Lint and Type Check"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout"
              uses: actions/checkout@v4

            - name: "Setup Python"
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"

            - name: "Setup Node.js"
              uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: "npm"

            - name: "Install Node.js dependencies"
              run: npm ci

            - name: "Install Python tools"
              run: |
                  python -m pip install --upgrade pip
                  pip install pre-commit ty

            - name: "Run pre-commit"
              uses: pre-commit/action@v3.0.0
              env:
                  SKIP: "semgrep-frappe, ty"

    semgrep:
        name: "Semgrep"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout"
              uses: actions/checkout@v4

            - name: "Setup Python"
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"

            - name: "Install Semgrep"
              run: |
                  python -m pip install --upgrade pip
                  pip install semgrep

            - name: "Run Semgrep"
              run: |
                  semgrep \
                    --config=https://github.com/frappe/semgrep-rules \
                    --config=r/python.lang.correctness

    deps-vulnerable-check:
        name: "Vulnerable Dependency Check"
        runs-on: ubuntu-latest

        steps:
            - name: "Checkout"
              uses: actions/checkout@v4

            - name: "Setup Python"
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: "pip"

            - name: "Install pip-audit"
              run: |
                  python -m pip install --upgrade pip
                  pip install pip-audit

            - name: "Audit dependencies"
              run: |
                  pip-audit --desc on .
