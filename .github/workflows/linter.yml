name: Linters

on:
  pull_request:
  workflow_dispatch:

env:
  PRE_COMMIT_VERSION: "4.6.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: "Frappe Linter"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Node.js dependencies
        run: npm ci
      - name: Run pre-commit
        run: |
          python -m pip install "pre-commit==${PRE_COMMIT_VERSION}"
          pre-commit run --all-files
        env:
          SKIP: ty-check

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: "Vulnerable Dependency Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Always runs and always reports: `Vulnerable Dependency Check` is a required
      # status check, so gating the job itself would leave the pull request pending.
      - name: Detect change scope
        id: scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -Eeuo pipefail

          if [[ "$HEAD_REF" == release-please--* ]]; then
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "Release Please branch: skipping dependency checks."
            exit 0
          fi

          if [[ -z "$BASE_REF" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "No base ref available: running the dependency check."
            exit 0
          fi

          git fetch --no-tags origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" >/dev/null 2>&1 || true
          if ! changed=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Could not resolve the diff against origin/${BASE_REF}: running the dependency check."
            exit 0
          fi

          if [[ -z "$changed" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Empty diff against origin/${BASE_REF}: running the dependency check."
            exit 0
          fi

          readonly allowlist='^([^/]+\.md|(.*/)?AGENTS\.md|docs/.*|\.github/.*\.md|\.github/ISSUE_TEMPLATE/.*|\.agents/.*|\.codex/.*|\.vscode/.*|license\.txt|\.gitignore|\.editorconfig|\.release-please-manifest\.json)$'
          if impacting=$(printf '%s\n' "$changed" | grep -Ev "$allowlist"); then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Files that can affect runtime behaviour:"
            printf '%s\n' "$impacting"
          else
            echo "run_full=false" >> "$GITHUB_OUTPUT"
            echo "Only documentation and agent configuration changed:"
            printf '%s\n' "$changed"
          fi

      - uses: actions/setup-python@v5
        if: steps.scope.outputs.run_full == 'true'
        with:
          python-version: "3.14"

      - name: Cache pip
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Install and run pip-audit
        if: steps.scope.outputs.run_full == 'true'
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on .
