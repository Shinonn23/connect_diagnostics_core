name: Discord Release Notify

on:
    release:
        types: [published]

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - name: Notify Release to Discord
              env:
                  WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
              run: |
                  COLOR=5763719  # Green

                  # Prepare release body
                  BODY_CONTENT="${{ github.event.release.body }}"
                  if [ ${#BODY_CONTENT} -gt 300 ]; then
                    BODY_CONTENT="${BODY_CONTENT:0:300}..."
                  fi

                  # Build Discord embed
                  PAYLOAD=$(jq -n \
                    --arg title "${{ github.event.release.name }}" \
                    --arg url "${{ github.event.release.html_url }}" \
                    --arg repo "${{ github.repository }}" \
                    --arg tag "${{ github.event.release.tag_name }}" \
                    --arg actor "${{ github.event.release.author.login }}" \
                    --arg avatar "${{ github.event.release.author.avatar_url }}" \
                    --arg body "$BODY_CONTENT" \
                    --arg color "$COLOR" \
                    --arg created "${{ github.event.release.created_at }}" \
                    '{
                      username: "GitHub Releases",
                      avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                      embeds: [{
                        title: $title,
                        url: $url,
                        description: (if $body and $body != "" then $body else "*No release notes*" end),
                        color: ($color | tonumber),
                        author: {
                          name: $actor,
                          icon_url: $avatar,
                          url: ("https://github.com/" + $actor)
                        },
                        fields: [
                          {
                            name: "Repository",
                            value: $repo,
                            inline: true
                          },
                          {
                            name: "Version",
                            value: $tag,
                            inline: true
                          }
                        ],
                        footer: {
                          text: ("Released • " + ($created | split("T")[0]))
                        }
                      }]
                    }')

                  # Send to Discord
                  curl -X POST -H "Content-Type: application/json" \
                    -d "$PAYLOAD" \
                    "$WEBHOOK"
