name: Discord PR Notify

on:
    pull_request:
        types: [opened, reopened, closed]

jobs:
    notify:
        runs-on: ubuntu-latest
        steps:
            - name: Notify PR to Discord
              env:
                  WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_PR }}
              run: |
                  # Determine action color
                  case "${{ github.event.action }}" in
                    opened)
                      COLOR=16705372  # Yellow
                      ;;
                    closed)
                      COLOR=5763719  # Green
                      ;;
                    reopened)
                      COLOR=15548997  # Red
                      ;;
                  esac

                  # Prepare description
                  DESCRIPTION="${{ github.event.pull_request.body }}"
                  if [ ${#DESCRIPTION} -gt 300 ]; then
                    DESCRIPTION="${DESCRIPTION:0:300}..."
                  fi

                  # Build Discord embed
                  PAYLOAD=$(jq -n \
                    --arg title "${{ github.event.pull_request.title }}" \
                    --arg url "${{ github.event.pull_request.html_url }}" \
                    --arg repo "${{ github.repository }}" \
                    --arg number "${{ github.event.pull_request.number }}" \
                    --arg actor "${{ github.actor }}" \
                    --arg avatar "${{ github.event.sender.avatar_url }}" \
                    --arg action "${{ github.event.action }}" \
                    --arg description "$DESCRIPTION" \
                    --arg color "$COLOR" \
                    --arg created "${{ github.event.pull_request.created_at }}" \
                    --arg branch "${{ github.event.pull_request.head.ref }}" \
                    '{
                      username: "GitHub Pull Requests",
                      avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
                      embeds: [{
                        title: ("#" + $number + " " + $title),
                        url: $url,
                        description: (if $description and $description != "" then $description else "*No description provided*" end),
                        color: ($color | tonumber),
                        author: {
                          name: $actor,
                          icon_url: $avatar,
                          url: ("https://github.com/" + $actor)
                        },
                        fields: [
                          {
                            name: "Repository",
                            value: $repo,
                            inline: true
                          },
                          {
                            name: "Status",
                            value: ($action | ascii_upcase),
                            inline: true
                          },
                          {
                            name: "Branch",
                            value: $branch,
                            inline: false
                          }
                        ],
                        footer: {
                          text: ("Created • " + ($created | split("T")[0]))
                        }
                      }]
                    }')

                  # Send to Discord
                  curl -X POST -H "Content-Type: application/json" \
                    -d "$PAYLOAD" \
                    "$WEBHOOK"
