name: Auto Version Bump

# Bumps __version__ on the PR's head branch according to the project's
# SemVer 0.MINOR.PATCH policy:
#   feat  -> +1 MINOR (PATCH resets to 0)
#   fix / refactor / chore / style / test / docs / perf / build / ci -> +1 PATCH
#   revert / unrecognized -> skipped (apply manually)
# Only runs for PRs that target `developments`, so promotion PRs to
# user-acceptance-testing / production never double-bump. Idempotent: if the
# version was already changed on the branch (manual or a previous run) it does
# nothing.
on:
    pull_request:
        branches:
            - developments
        types: [opened, synchronize, reopened]

permissions:
    contents: write

concurrency:
    group: auto-version-${{ github.event.number }}
    cancel-in-progress: true

jobs:
    bump:
        name: Bump version
        runs-on: ubuntu-latest
        # Skip PRs opened by the bot's own bump commit just in case
        if: github.event.pull_request.head.repo.full_name == github.repository
        steps:
            - name: Checkout PR head branch
              uses: actions/checkout@v4
              with:
                  repository: ${{ github.event.pull_request.head.repo.full_name }}
                  ref: ${{ github.event.pull_request.head.ref }}
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Compute version bump
              id: bump
              env:
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  BASE_REF: ${{ github.event.pull_request.base.ref }}
              run: |
                  set -euo pipefail
                  git fetch origin "$BASE_REF" --depth=1
                  python3 - <<'PY'
                  import os, re, subprocess, sys

                  PATH = "connect_diagnostics_core/__init__.py"
                  VER_RE = re.compile(r'__version__\s*=\s*"(\d+)\.(\d+)\.(\d+)"')

                  def out(**kv):
                      with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                          for k, v in kv.items():
                              f.write(f"{k}={v}\n")

                  def parse(text):
                      m = VER_RE.search(text)
                      if not m:
                          sys.exit(f"Could not find __version__ in {PATH}")
                      return tuple(int(x) for x in m.groups())

                  base_ref = os.environ["BASE_REF"]
                  base = parse(subprocess.check_output(
                      ["git", "show", f"origin/{base_ref}:{PATH}"], text=True))

                  with open(PATH) as f:
                      cur_text = f.read()
                  cur = parse(cur_text)

                  base_s = ".".join(map(str, base))
                  cur_s = ".".join(map(str, cur))

                  # Respect any version change already present on the PR branch
                  # (manual override or a previous run of this workflow).
                  if cur != base:
                      print(f"Version already changed on this PR ({base_s} -> {cur_s}); skipping.")
                      out(changed="false")
                      sys.exit(0)

                  title = os.environ.get("PR_TITLE", "")
                  m = re.match(r"\s*([A-Za-z]+)", title)
                  ptype = m.group(1).lower() if m else ""

                  MINOR = {"feat"}
                  PATCH = {"fix", "refactor", "chore", "style", "test",
                           "docs", "perf", "build", "ci"}

                  major, minor, patch = base
                  if ptype in MINOR:
                      minor += 1
                      patch = 0
                  elif ptype in PATCH:
                      patch += 1
                  elif ptype == "revert":
                      print("Revert PR: bump must be applied manually (inverse of reverted change). Skipping.")
                      out(changed="false")
                      sys.exit(0)
                  else:
                      print(f"Unrecognized PR type '{ptype or '(none)'}' in title; skipping auto-bump.")
                      out(changed="false")
                      sys.exit(0)

                  new = f"{major}.{minor}.{patch}"
                  with open(PATH, "w") as f:
                      f.write(VER_RE.sub(f'__version__ = "{new}"', cur_text))
                  print(f"Bumping {base_s} -> {new} (PR type: {ptype})")
                  out(changed="true", new_version=new)
                  PY

            - name: Commit and push bump
              if: steps.bump.outputs.changed == 'true'
              env:
                  NEW_VERSION: ${{ steps.bump.outputs.new_version }}
                  HEAD_REF: ${{ github.event.pull_request.head.ref }}
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add connect_diagnostics_core/__init__.py
                  git commit -m "chore: bump version to ${NEW_VERSION}"
                  git push origin "HEAD:${HEAD_REF}"
