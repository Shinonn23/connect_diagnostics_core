name: Change scope
description: Decide whether a pull request needs the expensive bench-based checks.

outputs:
  run_full:
    description: '"true" when the pull request can affect app runtime behaviour.'
    value: ${{ steps.scope.outputs.run_full }}

runs:
  using: composite
  steps:
    - name: Classify changed files
      id: scope
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -Eeuo pipefail

        # Release Please only rewrites the version, the manifest and the changelog.
        # It is matched by branch rather than by path because it also touches
        # connect_diagnostics_core/__init__.py, which stays outside the allowlist so a
        # genuine code change to that file still runs the full checks.
        if [[ "$HEAD_REF" == release-please--* ]]; then
          echo "run_full=false" >> "$GITHUB_OUTPUT"
          echo "Release Please branch: skipping bench-based checks."
          exit 0
        fi

        if [[ -z "$BASE_REF" ]]; then
          echo "run_full=true" >> "$GITHUB_OUTPUT"
          echo "No base ref available: running the full checks."
          exit 0
        fi

        git fetch --no-tags origin \
          "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}" >/dev/null 2>&1 || true
        if ! changed=$(git diff --name-only "origin/${BASE_REF}...HEAD"); then
          echo "run_full=true" >> "$GITHUB_OUTPUT"
          echo "Could not resolve the diff against origin/${BASE_REF}: running the full checks."
          exit 0
        fi

        if [[ -z "$changed" ]]; then
          echo "run_full=true" >> "$GITHUB_OUTPUT"
          echo "Empty diff against origin/${BASE_REF}: running the full checks."
          exit 0
        fi

        # Paths that cannot change how the app behaves at runtime. Everything else --
        # including connect_diagnostics_core/**, DocType JSON, dependency manifests and
        # .github/workflows/** -- deliberately falls through to the full checks.
        readonly allowlist='^([^/]+\.md|\.github/.*\.md|\.github/ISSUE_TEMPLATE/.*|\.claude/.*|\.agents/.*|\.codex/.*|\.vscode/.*|license\.txt|\.gitignore|\.editorconfig|\.release-please-manifest\.json)$'

        if impacting=$(printf '%s\n' "$changed" | grep -Ev "$allowlist"); then
          echo "run_full=true" >> "$GITHUB_OUTPUT"
          echo "Files that can affect runtime behaviour:"
          printf '%s\n' "$impacting"
        else
          echo "run_full=false" >> "$GITHUB_OUTPUT"
          echo "Only documentation and agent configuration changed:"
          printf '%s\n' "$changed"
        fi
